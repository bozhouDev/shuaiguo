# 甩锅侠静态站点：开 gzip、按文件类型设缓存时长（替换 nginx 镜像自带的 default.conf）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 文本类文件压缩传输：game.js 约 100 KB → 约 30 KB。PNG / woff2 本身已压缩，不再压
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 图集和字体：文件名或地址里带内容哈希，内容变了地址就变，可以放心缓存一年
    location /assets/atlas/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其他素材（单张像素图、大厅背景）：缓存 1 天，更新后最多隔一天生效
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # 页面、脚本、样式：每次都向服务器确认是否更新（没变只回 304，不重新下载），保证发版后立刻生效
    location / {
        add_header Cache-Control "no-cache";
    }
}
