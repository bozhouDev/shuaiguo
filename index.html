<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>这锅你来背</title>
<!-- 自托管的子集字体（assets_pixel/build_fonts.py 生成），不再走 Google Fonts -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stage"></canvas>
<!-- 顶部 HUD：时钟、身上锅数（满 12 压垮）、当前名次、背锅次数、连甩、设置/暂停 -->
<div id="hud">
  <span class="chip"><img class="ico" data-px="ui_clock" alt=""><span id="hClock">09:00</span></span>
  <span class="chip" id="hPots"><img class="ico" data-px="ui_wok" alt=""><span id="hPotsN">0/12</span><span class="bar red"><i id="hPotsBar"></i></span></span>
  <span class="chip"><img class="ico" data-px="ui_crown" alt=""><span id="hRank">第 1/4 名</span></span>
  <span class="chip" id="hBlameChip"><img class="ico" data-px="ui_warning" alt=""><span id="hBlame">背锅 0</span></span>
  <span class="chip hot" id="hCombo" hidden>连甩 ×2</span>
  <span class="hud-right">
    <button class="chip" id="btnSkip" type="button" hidden>跳过带教</button>
    <button class="chip" id="btnSet" type="button" aria-label="设置"></button>
    <button class="chip" id="btnPause" type="button" aria-label="暂停"><img class="ico" data-px="ui_pause" alt=""></button>
  </span>
</div>
<!-- 工作群消息：散会、随机事件的预告 -->
<div id="msg"></div>
<div id="hint"></div>
<!-- 下班预告不挡操作；到点后在冻结的办公室上给出结果反馈。 -->
<div id="closingNotice" role="status" aria-live="polite" hidden><strong id="closingTitle"></strong><span id="closingDetail"></span></div>
<!-- 甩锅键（右下角）：甩出尾巴上的锅；锅飞来时变成「弹」 -->
<button id="btnThrow" type="button" aria-label="甩锅" hidden><b>甩!</b></button>
<!-- 大厅：开局先到这里，内容由 game.js 的 showLobby 生成 -->
<div id="lobby" hidden></div>
<div id="ui" class="overlay" hidden></div>
<div id="toast"></div>
<script src="js/engine.js"></script>
<script src="js/atlas.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
