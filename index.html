<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>甩锅侠</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&family=ZCOOL+KuaiLe&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stage"></canvas>
<!-- 顶部 HUD：时钟、身上锅数（满 12 压垮）、当前名次、背锅次数、连甩、设置/暂停 -->
<div id="hud">
  <span class="chip"><img class="ico" src="assets/px/ui_clock.png" alt=""><span id="hClock">09:00</span></span>
  <span class="chip" id="hPots"><img class="ico" src="assets/px/ui_wok.png" alt=""><span id="hPotsN">0/12</span><span class="bar red"><i id="hPotsBar"></i></span></span>
  <span class="chip"><img class="ico" src="assets/px/ui_crown.png" alt=""><span id="hRank">第 1/4 名</span></span>
  <span class="chip" id="hBlameChip"><img class="ico" src="assets/px/ui_warning.png" alt=""><span id="hBlame">背锅 0</span></span>
  <span class="chip hot" id="hCombo" hidden>连甩 ×2</span>
  <span class="hud-right">
    <button class="chip" id="btnSet" type="button" aria-label="设置"></button>
    <button class="chip" id="btnPause" type="button" aria-label="暂停"><img class="ico" src="assets/px/ui_pause.png" alt=""></button>
  </span>
</div>
<!-- 工作群消息：散会、随机事件的预告 -->
<div id="msg"></div>
<div id="hint"></div>
<!-- 甩锅键（右下角）：甩出尾巴上的锅；锅飞来时变成「弹」 -->
<button id="btnThrow" type="button" aria-label="甩锅" hidden><b>甩!</b></button>
<!-- 大厅：开局先到这里，内容由 game.js 的 showLobby 生成 -->
<div id="lobby" hidden></div>
<div id="ui" class="overlay" hidden></div>
<div id="toast"></div>
<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
